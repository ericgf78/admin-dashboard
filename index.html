<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin-Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="layout">
        <div id="column1">
            <div id="dashboard">
                 <h1>Dashboard</h1>
            </div>
            <div class="section1">
                <h2>Home</h2>
                <h2>Profile</h2>
                <h2>Messages</h2>
                <h2>History</h2>
                <h2>Tasks</h2>
                <h2>Communities</h2>
            </div>
            <div class="section2">
                <h2>Settings</h2>
                <h2>Support</h2>
                <h2>Privacy</h2>
            </div>    
        </div>
        <div id="column2">
            <div id="header">
                <div id="header1">
                    <form method="get" role="search">
                    <input type="search" id="site-search"/>
                    </form>
                    <div id="header1-username">
                        <img src="./assets/profile.jpg" alt="profile picture" height="35px" width="auto">
                        <h4>Eric Fadul</h4>
                    </div>
                </div>
                <div id="header2">
                    <img src="./assets/profile.jpg" alt="profile picture" height="100px" width="auto">
                    <div id="header2-section1">
                        <h4>Hi there,</h3>
                        <h2 id="username">Eric Fadul (@ericgf)</h2>
                    </div>
                    <div id="header2-section2">
                        <button>New</button>
                        <button>Upload</button>
                        <button>Share</button>
                    </div>
                </div>
            </div>
            <div id="content">
                <div id="cards">
                    <p id="content-text-1">Your Projects</p>
                    <div class="card"></div>
                    <div class="card"></div>
                    <div class="card"></div>
                    <div class="card"></div>
                    <div class="card"></div>
                    <div class="card"></div>
                </div>
                <div id="side-content">
                    <p id="content-text-2">Announcements</p>      
                    <div id="announcement"></div>
                    <p id="content-text-3">Trending</p>
                    <div id="trending"></div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
